# ==============================================================================
# Nginx Configuration for QuickChat Frontend & Reverse Proxy
#
# ------------------------------------------------------------------------------
# FREQUENTLY ASKED QUESTIONS (FAQ) & ARCHITECTURE NOTES
# ------------------------------------------------------------------------------
# 1. WHY DO WE NEED NGINX.CONF?
#    - Serves the Frontend: React's build output consists of static files (HTML, JS, CSS) that cannot run or serve themselves; they require a web server.
#    - Solves the SPA Refresh Problem (404s): It solves the Single Page Application (SPA) refresh problem: without 'try_files', refreshing /login or /profile returns a 404 Not Found.
#    - Acts as a Reverse Proxy (Eliminates CORS): It eliminates CORS (Cross-Origin Resource Sharing): browser communicates solely with port 3000 (Nginx), and Nginx forwards /api/ and /ws/ requests to Spring Boot on the internal Docker network.
#
# ------------------------------------------------------------------------------
# 2. WHAT IS "location"?
#    - 'location' is an Nginx routing directive that matches the PATH portion of the incoming URL (e.g. '/', '/api/', '/ws/').
#    - It tells Nginx: "When a request arrives matching this URL pattern, execute the instructions defined inside this block."
#
# ------------------------------------------------------------------------------
# 3. HOW ARE VARIABLES ($host, $remote_addr, etc.) PASSED TO IT?
#    - They are NOT manually passed or declared in code; they are built-in Nginx runtime variables extracted automatically for each incoming request:
#        * $remote_addr : Extracted from the client's TCP socket connection.
#        * $host        : Extracted from the browser's HTTP 'Host:' request header.
#        * $scheme      : Extracted from the protocol used ('http' or 'https').
#        * $http_<name> : Captures any HTTP request header (e.g. $http_upgrade reads 'Upgrade:').
#        * $proxy_add_x_forwarded_for : Built-in variable appending client IP to existing proxies.
# ==============================================================================

server {
    # Listen on port 80 inside the container (mapped to host port 3000 in docker-compose.yml)
    listen 80;

    # Optional server name (can be replaced by your domain in production, e.g., chat.example.com)
    server_name localhost;

    # Maximum allowed request body size (Nginx defaults to 1M, causing HTTP 413 on image uploads)
    client_max_body_size 50M;


    # --------------------------------------------------------------------------
    # 1. SPA Routing: Serve React Static Files
    # --------------------------------------------------------------------------
    # Matches all general browser requests (e.g., '/', '/login', '/profile', '/assets/index.js')
    location / {
        # Directory where compiled React production assets were copied from the build stage
        root /usr/share/nginx/html;

        # Default fallback document when a directory is requested
        index index.html index.htm;

        # Critical for React Router (Single Page Application):
        # - $uri        : Serves exact static file if it exists on disk (e.g. /assets/app.js)
        # - $uri/       : Serves directory index if it exists
        # - /index.html : If neither exists (e.g. user visits /login), falls back to index.html
        #                 so React Router can load and display the route on the client side.
        try_files $uri $uri/ /index.html;
    }


    # --------------------------------------------------------------------------
    # 2. REST API Reverse Proxy: Forward /api/ requests to Spring Boot
    # --------------------------------------------------------------------------
    # Matches all REST endpoints (e.g., '/api/auth/login', '/api/messages/new-message')
    location /api/ {
        # Forward traffic to the 'backend' container on internal Docker port 8080.
        # Docker's internal DNS automatically maps the hostname 'backend' to its container IP.
        proxy_pass http://backend:8080/api/;

        # Pass the original host header sent by client browser (e.g., localhost:3000)
        proxy_set_header Host $host;

        # Pass real client IP address ($remote_addr from TCP socket) to Spring Boot
        proxy_set_header X-Real-IP $remote_addr;

        # Append client IP to X-Forwarded-For chain for tracking proxy hops
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Informs Spring Boot whether the original client request was HTTP or HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --------------------------------------------------------------------------
    # 3. WebSocket Reverse Proxy: Forward /ws/ STOMP & SockJS Connections
    # --------------------------------------------------------------------------
    # Matches real-time WebSocket communication endpoints (e.g., '/ws/info', '/ws/websocket')
    location /ws {
        # Forward connection requests to Spring Boot's WebSocket endpoint
        proxy_pass http://backend:8080/ws;

        # WebSockets require HTTP/1.1 (Nginx default proxy protocol is HTTP/1.0)
        proxy_http_version 1.1;

        # Headers required to upgrade HTTP connection into a full-duplex TCP WebSocket stream:
        # $http_upgrade extracts the value of the client's HTTP 'Upgrade:' header (e.g., "websocket")
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward original client host and IP details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # By default, Nginx closes idle connections after 60 seconds (proxy_read_timeout 60s).
        # Setting timeout to 86400s (24 hours) keeps the WebSocket open continuously
        # even when users are idle in the chat.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
